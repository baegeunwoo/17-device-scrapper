<!doctype html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>PC 추천 사이트</title>
  </head>
  <body class="bg-slate-50">
    <!-- 히어로 섹션: 그라데이션 배경 -->
    <div
      class="w-full bg-gradient-to-br from-[#43637E] via-[#5B7FA6] to-[#8FB8D6] pt-20 pb-32 relative overflow-hidden"
    >
      <!-- 배경 장식 원 -->
      <div
        class="absolute -top-20 -right-20 w-96 h-96 bg-white/10 rounded-full blur-3xl"
      ></div>
      <div
        class="absolute -bottom-32 -left-10 w-80 h-80 bg-white/10 rounded-full blur-3xl"
      ></div>

      <div class="w-full max-w-3xl mx-auto px-4 relative z-10 text-center">
        <p class="text-white/70 font-medium mb-3 tracking-wide">
          예산에 맞는 최적의 견적을 찾아드립니다
        </p>
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-2">
          PC 부품 견적 추천
        </h1>
        <p class="text-white/80">예산과 용도만 입력하면 끝!</p>
      </div>
    </div>

    <!-- 검색 카드: 히어로 위에 살짝 겹쳐서 배치 -->
    <div class="w-full max-w-3xl mx-auto px-4 -mt-16 relative z-20">
      <form
        action="/search"
        class="w-full bg-white rounded-2xl shadow-xl shadow-slate-300/50 p-6 md:p-8 flex flex-col md:flex-row gap-4 items-stretch"
      >
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1"
            >예산</label
          >
          <input
            name="budget"
            type="number"
            required
            placeholder="예: 150만원"
            class="w-full h-12 px-4 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#43637E] focus:outline-none focus:ring-2 focus:ring-[#43637E]/20 transition"
          />
        </div>

        <div class="md:w-40">
          <label class="block text-xs font-semibold text-slate-500 mb-1 ml-1"
            >용도</label
          >
          <select
            name="purpose"
            class="w-full h-12 px-4 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#43637E] focus:outline-none focus:ring-2 focus:ring-[#43637E]/20 transition cursor-pointer"
          >
            <option value="game">게임용</option>
            <option value="work">사무용</option>
            <option value="ai">AI용</option>
          </select>
        </div>

        <div class="flex items-end">
          <button
            class="w-full md:w-auto h-12 px-8 bg-[#43637E] hover:bg-[#35506A] text-white font-semibold rounded-lg cursor-pointer transition shadow-lg shadow-[#43637E]/30"
          >
            조회하기
          </button>
        </div>
      </form>
    </div>

    <!-- 결과/컨텐츠가 들어갈 공간 -->
    <div class="w-full max-w-3xl mx-auto px-4 py-16">
      <!-- 예: 추천 결과 카드들이 여기 들어갈 자리 -->
    </div>
  </body>
</html>
